# Smithery configuration for Jurisprudência TJMS
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_tjms

name: tjms-mcp
displayName: "Jurisprudência TJMS"
description: >
  Pesquise jurisprudência do TJMS direto do seu agente de IA, em português comum. Cada acórdão vem com órgão julgador, relator, data, o trecho exato que casou a busca e o link oficial. A mesma conexão alcança outros 16 tribunais, incluindo STF, STJ e TST. Grátis, sem login.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/tjms-mcp
repository: https://github.com/mcp-dir/tjms-mcp

tags:
  - tjms
  - mato-grosso-do-sul
  - jurisprudencia
  - acordaos
  - tribunal-de-justica
  - case-law
  - brazil
  - read-only
  - no-auth
  - free

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_tjms

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_tjms/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
